services:

  # ── LocalStack — emulates AWS IoT Core / MQTT broker ─────────────────────
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"
      - "1883:1883"
      - "8883:8883"
    environment:
      - SERVICES=iot,sts,s3
      - DEBUG=1
      - PERSIST_ALL=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - iot-net

  # ── Camera proxy — serves PC camera frames over HTTP ─────────────────────
  #
  # Set CAMERA_SOURCE in .env to match your hardware:
  #
  #   CAMERA_SOURCE=network  (default)
  #     Built-in camera (Intel IPU / any Windows camera):
  #       Run on Windows:  python scripts/windows-camera-server.py
  #       Docker fetches from http://host.docker.internal:8081/frame.jpg
  #
  #   CAMERA_SOURCE=v4l2
  #     USB webcam attached via usbipd-win:
  #       Windows (Admin PS):  usbipd bind --busid X-Y
  #                            usbipd attach --wsl --busid X-Y
  #       WSL2:                ls /dev/video*
  #
  #   CAMERA_SOURCE=pattern
  #     Animated test pattern — no camera required.
  #
  camera-proxy:
    build:
      context: .
      dockerfile: Dockerfile.camera-proxy
    image: esp32p4-camera-proxy:latest
    container_name: camera-proxy
    # Uncomment the devices block ONLY when CAMERA_SOURCE=v4l2 (USB webcam via
    # usbipd-win).  Leaving it active on a system without /dev/video0 causes
    # "docker compose up" to fail immediately with "no such file or directory".
    #devices:
    #  - "/dev/video0:/dev/video0"
    environment:
      - CAMERA_SOURCE=${CAMERA_SOURCE:-network}
      # network mode: Windows built-in camera served by windows-camera-server.py
      - CAMERA_URL=http://host.docker.internal:${WIN_CAMERA_PORT:-8081}/frame.jpg
      # v4l2 mode: USB camera device index
      - CAMERA_DEVICE=0
      - CAMERA_WIDTH=640
      - CAMERA_HEIGHT=480
      - JPEG_QUALITY=85
      - PORT=8080
    ports:
      - "8080:8080"   # http://localhost:8080/stream — live preview in browser
    extra_hosts:
      - "host.docker.internal:host-gateway"   # WSL2: resolve Windows host
    networks:
      - iot-net

  # ── MicroPython builder — cross-compiles firmware for ESP32-P4 ────────────
  micropython-builder:
    build:
      context: .
      dockerfile: Dockerfile.micropython
      target: builder
      args:
        MPY_TAG: v1.24.0
    image: esp32p4-micropython:latest
    container_name: micropython-builder
    volumes:
      - ./micropython/boards/ESP32_P4_CAM:/opt/micropython/ports/esp32/boards/ESP32_P4_CAM
      - ./micropython/modules:/opt/micropython/ports/esp32/modules_camera
      - ./micropython/src:/opt/micropython/ports/esp32/modules_frozen
      - ./firmware-out:/firmware-out
    environment:
      - EXTRA_COMPONENT_DIRS=/opt/esp32-camera
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - iot-net

  # ── ESP32-P4 emulator — runs firmware in QEMU as bare-metal ──────────────
  #
  # Network topology inside the container:
  #   QEMU guest (MicroPython)
  #     → 10.0.2.2:1883  → socat → localstack:1883       (MQTT)
  #     → 10.0.2.2:8080  → socat → camera-proxy:8080     (camera frames)
  #
  esp32p4-emulator:
    build:
      context: .
      dockerfile: Dockerfile.qemu
    image: esp32p4-emulator:latest
    container_name: esp32p4-emulator
    volumes:
      # Mount the directory, not the file — Docker creates a directory if the
      # file path doesn't exist yet, which silently breaks run-qemu.sh.
      - ./firmware-out:/firmware:ro
      - ./micropython/src:/scripts:ro
    environment:
      - FIRMWARE_BIN=/firmware/firmware.bin
      - SCRIPTS_DIR=/scripts
      - FLASH_SIZE_MB=8
      - FS_OFFSET=0x200000
      - FS_SIZE_MB=2
      - MQTT_BROKER=10.0.2.2
      - MQTT_PORT=1883
      - THING_NAME=${THING_NAME:-esp32p4-device-01}
      - LOCALSTACK_HOST=localstack
      - CAMERA_PROXY_HOST=camera-proxy
      - CAMERA_PROXY_PORT=8080
      - SERIAL_PORT=2323
      - GDB_PORT=1234
    ports:
      - "2323:2323"     # serial REPL  →  telnet localhost 2323
      - "1234:1234"     # GDB stub
    depends_on:
      localstack:
        condition: service_healthy
      camera-proxy:
        condition: service_started
    networks:
      - iot-net

volumes:
  localstack_data:

networks:
  iot-net:
    driver: bridge
